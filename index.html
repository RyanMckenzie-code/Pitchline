<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5ef"><title>Pitchline — Guitar tuner</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><svg viewBox="0 0 40 35" aria-hidden="true"><path d="M2 18h6l4-12 6 24 6-25 5 16 3-7 4 4h3"/></svg>Pitchline</div><span class="mono"><i></i> A4 = 440 Hz</span></header>
<main><h1>Guitar tuner<span>.</span></h1><p class="intro">Choose a tuning, enable your microphone, and play a string.</p>
<section class="screen" aria-label="Pitch monitor"><div class="top"><span class="mono"><b class="bars">▂▆▃▇</b> PITCH MONITOR</span><span class="status" id="status">● &nbsp;MIC OFF</span></div>
<div class="readout" id="note">E<sub>2</sub></div><div id="hz">82.41 Hz target</div><div class="meter"><div id="ticks"></div><span id="needle"></span><div class="scale"><span>−50</span><span>−25</span><span>0</span><span>+25</span><span>+50</span></div></div><div id="feedback" role="status">Ready to tune</div></section>
<div class="controls"><div><label for="preset">Tuning</label><select id="preset"></select></div><button class="mic" id="mic"><svg width="17" height="20" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="6" height="12" rx="3"/><path d="M3 10v1a7 7 0 0 0 14 0v-1M10 18v4m-4 0h8"/></svg><span>Enable microphone</span></button></div>
<section class="bank"><div class="bankhead"><h2>Strings</h2><span class="mono">LOW TO HIGH →</span></div><div id="strings"></div><div id="custom"></div></section></main><script src="tuner.js"></script></body></html>
